name: Kaynaklari birlestir
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 build.py
      - name: Degisiklik varsa commit
        run: |
          git config user.name "lilit-bot"
          git config user.email "bot@users.noreply.github.com"
          git add plugins.json
          git diff --cached --quiet || git commit -m "plugins.json yenilendi"
          git push
